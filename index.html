<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dr Digibyte | Terminal Mode</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #000;
      color: #00ff00;
      font-family: 'Courier New', monospace;
      font-size: 16px;
    }
    .cmd-line::before {
      content: "C:\\Users\\DrDigibyte>";
      color: #00ccff;
      margin-right: 8px;
    }
    a {
      color: #ffff00;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .cursor {
      display: inline-block;
      width: 10px;
      background-color: #00ff00;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="cmd-line">Hi, I'm Soroush</div>
  <div class="cmd-line">I'm a telecom and network engineer</div>
  <div class="cmd-line">I create digital tools and educational content</div>
  <div class="cmd-line">YouTube: <a href="https://www.youtube.com/@DrDigibyte" target="_blank">youtube.com/@DrDigibyte</a></div>
  <div class="cmd-line">Instagram: <a href="https://www.instagram.com/drdigibyte" target="_blank">instagram.com/drdigibyte</a></div>
  <div class="cmd-line"><span class="cursor">&nbsp;</span></div>
</body>
</html>
